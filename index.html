<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>typerace</title>
<meta name="description" content="race bots by typing. how fast are your fingers fr?">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">type<b>race</b></div>
    <div class="right">
      <div class="pills" id="modes">
        <button class="pill" data-mode="sprint">sprint</button>
        <button class="pill on" data-mode="race">race</button>
        <button class="pill" data-mode="marathon">marathon</button>
      </div>
      <button class="icon-btn" id="theme" title="toggle theme" aria-label="toggle theme">◐</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="wpm">0</div><div class="l">wpm</div></div>
    <div class="stat"><div class="n" id="acc">100</div><div class="l">accuracy %</div></div>
    <div class="stat"><div class="n" id="time">0.0</div><div class="l">seconds</div></div>
    <div class="stat pb"><div class="n" id="pb">—</div><div class="l">personal best</div></div>
  </div>

  <div class="track" id="track"><div class="finish"></div></div>

  <div class="typebox" id="typebox">
    <div class="text" id="text"></div>
    <div class="focus-hint">click here or press any key to focus</div>
    <textarea id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="type here"></textarea>
  </div>

  <div class="hint">
    <span>start typing to launch 🏎️</span>
    <span><kbd>tab</kbd> new race</span>
    <span><kbd>esc</kbd> restart</span>
  </div>
</div>
<footer>no sign up. no ads. just vibes and fingers.</footer>

<div class="overlay" id="results">
  <div class="card">
    <div class="place" id="r-place">you placed 1st</div>
    <div class="big"><span id="r-wpm">0</span><small>wpm</small></div>
    <div class="newpb" id="r-pb"></div>
    <div class="vibe" id="r-vibe">main character energy</div>
    <div class="row">
      <div><b id="r-acc">100%</b><span>accuracy</span></div>
      <div><b id="r-time">0s</b><span>time</span></div>
      <div><b id="r-err">0</b><span>typos</span></div>
    </div>
    <div class="btns">
      <button class="btn" id="share">share flex</button>
      <button class="btn primary" id="again">run it back ↵</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
